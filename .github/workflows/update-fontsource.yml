name: Update Fontsource

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional: limit number of fonts (for debugging)"
        required: false
        default: ""
  schedule:
    # Daily at 03:15 UTC
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-fontsource
  cancel-in-progress: true

jobs:
  update-fontsource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate sources/fontsource.json
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "${LIMIT}" ]; then
            python scripts/fontsource-translator.py --limit "${LIMIT}"
          else
            python scripts/fontsource-translator.py
          fi

      - name: Validate sources/fontsource.json
        run: |
          python schemas/validate-sources.py sources/fontsource.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- sources/fontsource.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sources/fontsource.json
          git commit -m "Update fontsource.json"
          git push
