name: Update Nerd Fonts

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-nerd-fonts:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install requests jsonschema
      
      - name: Update Nerd Fonts v2
        run: |
          python scripts/nerd-fonts-translator.py
      
      - name: Validate sources
        run: |
          python schemas/validate-sources.py sources/nerd-fonts-v2.json
          # Frozen v1 (nerd-fonts.json) must remain unchanged by the translator.
          git diff --exit-code -- sources/nerd-fonts.json
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet sources/nerd-fonts-v2.json migrations/001-nerd-fonts-v1-to-v2.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sources/nerd-fonts-v2.json migrations/001-nerd-fonts-v1-to-v2.json
          git commit -m "Update Nerd Fonts v2 data [skip ci]"
      
      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push
      
      - name: Create summary
        run: |
          echo "## Nerd Fonts Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.changes.outputs.changed == 'true' && 'Updated' || 'No changes' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ -f sources/nerd-fonts-v2.json ]; then
            font_count=$(jq '.source_info.total_fonts' sources/nerd-fonts-v2.json)
            echo "- **Total Fonts (v2)**: $font_count" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f migrations/001-nerd-fonts-v1-to-v2.json ]; then
            rename_count=$(jq '.renames | length' migrations/001-nerd-fonts-v1-to-v2.json)
            echo "- **ID Renames**: $rename_count" >> $GITHUB_STEP_SUMMARY
          fi
